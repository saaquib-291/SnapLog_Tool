name: CI

on:
  push:
    branches:
      - main
      - develop
      - Restructure

  pull_request:
    branches:
      - main
      - develop
      - Restructure

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Repository Formatting
  # ============================================================
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

  # ============================================================
  # Windows Application
  # ============================================================
  windows-app:
    name: Windows App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: windows-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

      - name: Build React application
        run: npm run react-build

      - name: Build Electron application
        run: npm run build

  # ============================================================
  # Python Report Pipeline
  # ============================================================
  report-pipeline:
    name: Report Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: report-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: report-pipeline/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Python tests
        run: pytest -v

  # ============================================================
  # CI Summary
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest

    needs:
      - format
      - windows-app
      - report-pipeline

    if: success()

    steps:
      - name: CI completed successfully
        run: echo "All CI checks passed successfully."
